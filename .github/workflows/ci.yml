name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# One run per ref. Without this a burst of pushes stacks matrix legs and
# clock-skew runs on the same branch, and the oldest answers a question nobody
# is asking anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / test (Node ${{ matrix.node-version }})
    # Pinned: ubuntu-latest starts pointing at Ubuntu 26.04 on 2026-10-19
    # (actions/runner-images#14748), which would swap the build machine without
    # anyone approving it. Move to a newer image deliberately, and re-verify.
    runs-on: ubuntu-24.04
    # A hung suite must fail the job, not occupy a runner until the 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json "engines" (>=22.0.0) and the Docker base image
        # (node:22-slim). Node 20 stopped receiving releases in 2026-03; 26 is
        # still on the current line (not LTS), so it is not in the matrix yet.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret-scan step diffs the changeset against
          # origin/main, which a shallow clone (fetch-depth: 1) never fetches —
          # it is exactly what failed PR 64's verify job with "ambiguous
          # argument 'origin/main...HEAD'".
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build precedes typecheck: the shipped scripts (scripts/*.mjs) import the
      # compiled artifact (dist/*) at runtime and are under typecheck, so in a
      # clean checkout the artifact must exist before `tsc --noEmit` can resolve
      # those imports (TS2307 otherwise).
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Build precedes test: tests/verify-roster.test.ts spawns a script that
      # verifies with the shipped artifact (dist/registry/signing.js) rather than a
      # second implementation, so the artifact has to exist before that suite runs.
      - name: Unit tests
        run: npm test

      # deferred #25: the core chain as a re-runnable asset rather than a review
      # session's throwaway script. Loopback only, own key and own tokens.
      - name: Core-chain smoke on the compiled artifact
        run: npm run smoke:core

      # deferred #38: three static quality gates — ESLint (error-level baseline,
      # rules TypeScript already owns are off, see eslint.config.js), npm audit on
      # production dependencies (GitHub runners resolve the official registry, so
      # the audit endpoint is available here even when a mirror is not), and a
      # zero-dependency secret scan over the changeset since origin/main.
      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Secret scan (changeset)
        run: node scripts/scan-secrets.mjs --diff origin/main

  # deferred #24: wall-clock dependency gate. Runs the full suite under a
  # simulated future clock (scripts/clock-skew-setup.mjs shifts the JS clock +2y
  # via a vitest setup file, not `sudo date -s` — runners deny CAP_SYS_TIME and an
  # OS shift would break TLS to the npm registry). Any test or production path
  # that silently reads the real wall clock turns red here instead of "someday,
  # on its own". Dependencies are installed and the artifact is built on the real
  # clock first, so only the test run is skewed.
  clock-skew:
    name: wall-clock dependency gate (+2y)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies (real clock)
        run: npm ci

      # Same ordering as the verify job: typecheck resolves the shipped scripts'
      # dist/* imports, so build first.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests under a simulated future clock
        run: npx vitest run --config vitest.clock-skew.config.ts

  # deferred #39: the shipping image only got built by hand in review rounds, so
  # a Dockerfile change could break the build without CI noticing. Smoke it on
  # every push: build (no push), then verify the runner stage can actually run —
  # the zero-dependency keygen script bakes into the image, and the compiled
  # artifact loads. Ubuntu runners ship Docker with buildx default; nothing here
  # needs the extra binfmt/emulation or a registry login.
  image-smoke:
    name: image build + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t zeus:ci .

      - name: Smoke the image
        run: |
          docker run --rm --entrypoint sh zeus:ci -c 'node scripts/gen-rsk-key.mjs /tmp/rsk.key && test -s /tmp/rsk.key'
          docker run --rm --entrypoint node zeus:ci -e "require('./dist/index.js')"

