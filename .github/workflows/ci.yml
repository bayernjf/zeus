name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# One run per ref. Without this a burst of pushes stacks matrix legs and
# clock-skew runs on the same branch, and the oldest answers a question nobody
# is asking anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / test (Node ${{ matrix.node-version }})
    # Pinned: ubuntu-latest starts pointing at Ubuntu 26.04 on 2026-10-19
    # (actions/runner-images#14748), which would swap the build machine without
    # anyone approving it. Move to a newer image deliberately, and re-verify.
    runs-on: ubuntu-24.04
    # A hung suite must fail the job, not occupy a runner until the 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json "engines" (>=22.0.0) and the Docker base image
        # (node:22-slim). Node 20 stopped receiving releases in 2026-03; 26 is
        # still on the current line (not LTS), so it is not in the matrix yet.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret-scan step diffs the changeset against
          # origin/main, which a shallow clone (fetch-depth: 1) never fetches —
          # it is exactly what failed PR 64's verify job with "ambiguous
          # argument 'origin/main...HEAD'".
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # @model-hub/model-kit is a file: sibling dependency (W4-4); clone the
      # public monorepo to the expected path. Pinned to main — the same moving
      # target local development uses; W4-1a tag distribution is for external
      # consumers and lands with the W6 pnpm adoption.
      - name: "Clone model-hub sibling (file: dependency target)"
        run: |
          git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub
          npm ci --prefix ../model-hub --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      # Build precedes typecheck: the shipped scripts (scripts/*.mjs) import the
      # compiled artifact (dist/*) at runtime and are under typecheck, so in a
      # clean checkout the artifact must exist before `tsc --noEmit` can resolve
      # those imports (TS2307 otherwise).
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Build precedes test: tests/verify-roster.test.ts spawns a script that
      # verifies with the shipped artifact (dist/registry/signing.js) rather than a
      # second implementation, so the artifact has to exist before that suite runs.
      - name: Unit tests
        run: npm test

      # deferred #25: the core chain as a re-runnable asset rather than a review
      # session's throwaway script. Loopback only, own key and own tokens.
      - name: Core-chain smoke on the compiled artifact
        run: npm run smoke:core

      # deferred #38: three static quality gates — ESLint (error-level baseline,
      # rules TypeScript already owns are off, see eslint.config.js), npm audit on
      # production dependencies (GitHub runners resolve the official registry, so
      # the audit endpoint is available here even when a mirror is not), and a
      # zero-dependency secret scan over the changeset since origin/main.
      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Secret scan (changeset)
        run: node scripts/scan-secrets.mjs --diff origin/main

  # deferred #24: wall-clock dependency gate. Runs the full suite under a
  # simulated future clock (scripts/clock-skew-setup.mjs shifts the JS clock +2y
  # via a vitest setup file, not `sudo date -s` — runners deny CAP_SYS_TIME and an
  # OS shift would break TLS to the npm registry). Any test or production path
  # that silently reads the real wall clock turns red here instead of "someday,
  # on its own". Dependencies are installed and the artifact is built on the real
  # clock first, so only the test run is skewed.
  clock-skew:
    name: wall-clock dependency gate (+2y)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Same rationale as the verify job's model-hub sibling clone above.
      - name: "Clone model-hub sibling (file: dependency target)"
        run: |
          git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub
          npm ci --prefix ../model-hub --no-audit --no-fund

      - name: Install dependencies (real clock)
        run: npm ci

      # Same ordering as the verify job: typecheck resolves the shipped scripts'
      # dist/* imports, so build first.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests under a simulated future clock
        run: npx vitest run --config vitest.clock-skew.config.ts

  # deferred #39: the shipping image only got built by hand in review rounds, so
  # a Dockerfile change could break the build without CI noticing. Smoke it on
  # every push: build (no push), then verify the runner stage can actually run —
  # the zero-dependency keygen script bakes into the image, and the compiled
  # artifact loads. Ubuntu runners ship Docker with buildx default; nothing here
  # needs the extra binfmt/emulation or a registry login.
  image-smoke:
    name: image build + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t zeus:ci .

      - name: Smoke the image
        run: |
          docker run --rm --entrypoint sh zeus:ci -c 'node scripts/gen-rsk-key.mjs /tmp/rsk.key && test -s /tmp/rsk.key'
          docker run --rm --entrypoint node zeus:ci -e "require('./dist/index.js')"

  # Acceptance assets as a standing regression line. The verify-*.mjs scripts
  # (delegation chain, intent recognition, TUI surface, runtime reliability)
  # were previously only re-run by hand in review rounds, so a shipped-artifact
  # change could silently break the acceptance criteria until the next review.
  # All four are self-contained (they spawn the compiled artifact and mock their
  # own peers over loopback), so they can gate every push. Not included:
  # verify-roster (needs a key + roster source to be wired up deliberately) and
  # verify-decision-backend (fail-closed without ZEUS_DECISION_*/ZEUS_LLM_*
  # config, which CI does not carry).
  acceptance-assets:
    name: acceptance assets (delegation / intent / TUI / reliability)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Same rationale as the verify job's model-hub sibling clone above.
      - name: "Clone model-hub sibling (file dependency target)"
        run: |
          git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub
          npm ci --prefix ../model-hub --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Execute-delegation acceptance
        run: node scripts/verify-execute-delegation.mjs

      - name: Intent-recognition acceptance
        run: node scripts/verify-intent-recognize.mjs

      - name: TUI acceptance
        run: node scripts/verify-tui-recognize.mjs

      - name: Runtime-reliability acceptance
        run: node scripts/verify-runtime-reliability.mjs

  eval-gate:
    # design-evals §V3: quality regression gate. The runner boots one kernel
    # per case against loopback-only scripted agents and diffs the scored run
    # against the pinned baseline; a regression exits non-zero and fails CI.
    name: eval regression gate (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Same rationale as the verify job's model-hub sibling clone above.
      - name: "Clone model-hub sibling (file dependency target)"
        run: |
          git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub
          npm ci --prefix ../model-hub --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # design-evals V3: besides gating on block regressions (exit 1), render
      # the metrics diff as a PR comment body. The body is written before the
      # exit-code decision, so the next step can still post it on failure.
      - name: Eval run against pinned baseline
        id: eval
        run: node scripts/eval-run.mjs --baseline --comment-out /tmp/eval-comment.md

      # Idempotent upsert (one comment per PR, updated in place by marker).
      # always() so a block regression still gets its diff posted; the job's
      # conclusion stays red from the eval step. No-op on push builds and on
      # fork PRs, whose GITHUB_TOKEN is read-only.
      - name: Post eval metrics diff on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-pr-comment.mjs --body-file /tmp/eval-comment.md --marker '<!-- zeus-eval-gate -->'

  bench-capacity:
    # B1/A2 (2026-10-19): capacity regression gate. bench-capacity.mjs drives
    # the real kernel (Orchestrator -> Dispatcher -> undici -> loopback HTTP)
    # against a mock vassal farm; correctness invariants (every intent
    # completed, every branch canceled exactly once, no cancel lost/duplicated)
    # are hard gates inside the harness itself. bench-gate.mjs then compares
    # latency/throughput against the pinned per-fingerprint baseline in
    # capacity-baseline.json (+30% delay / -30% throughput red, +15%/-15%
    # warn). A runner whose fingerprint has no baseline yet passes in seeding
    # mode and archives the report; the pinned file is updated out-of-band.
    # Bench numbers are load-sensitive, so correctness is the hard gate here
    # and the latency comparison is a regression tripwire with headroom.
    name: capacity regression gate (loopback bench)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Same rationale as the verify job's model-hub sibling clone above.
      - name: "Clone model-hub sibling (file dependency target)"
        run: |
          git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub
          npm ci --prefix ../model-hub --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capacity bench against pinned baseline
        run: node scripts/bench-gate.mjs --report /tmp/capacity-report.json

      - name: Archive capacity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-report
          path: /tmp/capacity-report.json
          if-no-files-found: warn

  image-verify:
    # A3 (2026-10-19): the container-level four checks that review rounds used
    # to re-shoot by hand are now scripted (scripts/verify-image.mjs) and gate
    # every push: HEALTHCHECK healthy, /data/rsk.key 0600 node:node, SIGTERM
    # drains to kernel-state.json (0600, non-empty), restart restores the
    # snapshot; plus roster verification through the shipped verify-roster.mjs
    # (public /api/roster/public endpoint, no token needed) both before and
    # after the restart. Kept separate from image-smoke (build + module load)
    # because it actually boots the server and exercises shutdown/restart.
    name: image container-level verify (healthy / 0600 / SIGTERM / restore)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # verify-image.mjs rebuilds on the host before exercising the container,
      # so the model-hub sibling is needed here too.
      - name: "Clone model-hub sibling (file dependency target)"
        run: git clone --depth 1 https://github.com/bayernjf/model-hub.git ../model-hub

      - name: Build image
        run: docker build -t zeus:ci-verify .

      - name: Container-level verification
        run: node scripts/verify-image.mjs --tag zeus:ci-verify

